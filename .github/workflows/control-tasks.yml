name: Control tasks

# The control register's scheduler (substrate ADR 0026). Every six
# hours, substrate reads substrate-controls.yaml, the control-task
# issues, the incident issues and the Okta System Log (okta.logs.read
# only), and lists the tasks due: scheduled tasks whose day has come,
# and an event task for each event that has none yet. This job then
# opens each as an issue assigned to its owner. Substrate only reads;
# the job's own token opens the issues, and issues it opens are the only
# ones that count. Nothing but the task IDs is printed.
on:
  schedule:
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: control-tasks
  cancel-in-progress: false

env:
  SUBSTRATE_COMMIT: 5b042ae39f3204bc678cb902694cdd3b98c31c4a

jobs:
  open-due-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      # Full history: substrate reads the register's commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rookwright/substrate
          ref: ${{ env.SUBSTRATE_COMMIT }}
          ssh-key: ${{ secrets.SUBSTRATE_DEPLOY_KEY }}
          path: .substrate-src
          persist-credentials: false
      - name: Move substrate out of the checkout
        run: mv .substrate-src "$RUNNER_TEMP/substrate-src"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ runner.temp }}/substrate-src/go.mod
          cache: false
      - name: Build substrate
        run: cd "$RUNNER_TEMP/substrate-src" && go build -trimpath -o "$RUNNER_TEMP/substrate" ./cmd/substrate
      # Exit 1 means the Okta System Log couldn't be read: the other tasks
      # are still listed and opened, then the job fails so it shows.
      - name: List the tasks due
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          OKTA_ORG_URL: ${{ secrets.OKTA_ORG_URL }}
          OKTA_CLIENT_ID: ${{ secrets.OKTA_CLIENT_ID }}
          OKTA_KEY_ID: ${{ secrets.OKTA_KEY_ID }}
          OKTA_PRIVATE_KEY_PEM: ${{ secrets.OKTA_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$GH_TOKEN" > "$RUNNER_TEMP/github.token"
          printf '%s\n' "$OKTA_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/okta.pem"
          rc=0
          "$RUNNER_TEMP/substrate" control-tasks --register substrate-controls.yaml --as-of "$(date -u +%Y-%m-%d)" \
            --github-owner "${GITHUB_REPOSITORY%/*}" --github-repo "${GITHUB_REPOSITORY#*/}" \
            --github-token-path "$RUNNER_TEMP/github.token" --out "$RUNNER_TEMP/due.json" \
            --okta-org-url "$OKTA_ORG_URL" --okta-client-id "$OKTA_CLIENT_ID" --okta-key-id "$OKTA_KEY_ID" \
            --okta-private-key "$RUNNER_TEMP/okta.pem" > "$RUNNER_TEMP/list.log" 2>&1 || rc=$?
          rm -f "$RUNNER_TEMP/github.token" "$RUNNER_TEMP/okta.pem"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then echo "substrate control-tasks failed ($rc)"; exit "$rc"; fi
      - name: Open them
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create control-task --color 5319E7 --description "A control register task (substrate-controls.yaml)" --force > /dev/null
          count="$(jq length "$RUNNER_TEMP/due.json")"
          for i in $(seq 0 $((count - 1))); do
            jq -r ".[$i].body" "$RUNNER_TEMP/due.json" > "$RUNNER_TEMP/body.md"
            task="$(jq -r ".[$i].task" "$RUNNER_TEMP/due.json")"
            gh label create "task:$task" --color C5DEF5 --force > /dev/null
            gh issue create --title "$(jq -r ".[$i].title" "$RUNNER_TEMP/due.json")" \
              --label control-task --label "task:$task" \
              --assignee "$(jq -r ".[$i].assignee" "$RUNNER_TEMP/due.json")" \
              --body-file "$RUNNER_TEMP/body.md" > /dev/null
            echo "opened $task"
          done
          echo "$count task(s) opened"
      - name: Fail if the Okta System Log couldn't be read
        if: steps.list.outputs.rc == '1'
        run: |
          echo "The Okta System Log couldn't be read: Okta-triggered tasks weren't checked this run."
          exit 1
