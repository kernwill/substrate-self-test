name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  # Deliberately a hardcoded, secret-shaped literal (not a
  # ${{ secrets.X }} reference) to prove content-pattern redaction
  # fires on a real fixture, not just a unit test.
  AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pull requests only: the action needs a base and head ref, and
      # fails on a push to main, which would leave the required `test`
      # check never passing.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      - name: Run tests
        run: echo "tests would run here"
