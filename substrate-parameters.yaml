# Organization-defined parameter values for the substrate self-test: the
# yardsticks NIST leaves to the organization. Like the boundary file,
# this is the provider's declaration, approved through a reviewed pull
# request. It is never evidence: substrate judges collected evidence
# against it, and every report shows these values.
owner: Will Kern, CEO
declared_on: 2026-10-09
okta:
  # Every app sign-in policy in the Okta org, classified by who signs in
  # through it (ia-2.2 MFA for non-privileged accounts, ia-2.8
  # replay-resistant authentication). An unclassified policy leaves both
  # controls undetermined.
  privileged_access_policies:
    - Okta Admin Console
  non_privileged_access_policies:
    - Any two factors
    - Okta Account Management Policy
    - Okta Browser Plugin
    - Okta Dashboard
    - Okta OIN Submission Tester
    - substrate test - device required
  # The Okta profile attribute that records each user's status
  # (employee, contractor and so on), for ia-4.4.
  user_status_attribute: userType
audit:
  # Information every audit record of a client request must carry, on
  # every component that generates audit records (au-3.1). Substrate
  # checks a sample of real records from CloudTrail in each declared
  # Region and from the Okta System Log.
  additional_fields: [request_id, source_address, user_agent]
access:
  # Who is authorized to use security functions or reach
  # security-relevant information (ac-6.1). Substrate fails the control
  # if anyone else holds such access.
  #
  # AWS: an action on any of these services counts as security access.
  aws_security_services: [access-analyzer, cloudtrail, config, guardduty, iam, inspector2, kms, macie2, organizations, securityhub, sso]
  aws:
    # Terraform and the administrator.
    - arn:aws:iam::632839731153:user/substrate-admin
    # Substrate's read-only collector (reads security settings).
    - arn:aws:iam::632839731153:role/substrate-collector
    # The nightly drift check (GitHub Actions on main, by OIDC): reads
    # configuration, never data.
    - arn:aws:iam::632839731153:role/substrate-drift-check
    # The monthly incident drill: may only create GuardDuty sample
    # findings.
    - arn:aws:iam::632839731153:role/substrate-incident-drill
    # AWS Backup's service role: takes the daily snapshots and runs the
    # weekly restore tests (AWS's own managed backup and restore policies).
    - arn:aws:iam::632839731153:role/substrate-backup
    # Created by AWS when the account joined Rookwright's organization:
    # console access through AWS's account-access service, and two roles
    # Rookwright's management account (537695480935) uses to manage it.
    - arn:aws:iam::632839731153:role/managed/AccountFullAccessRole
    - arn:aws:iam::632839731153:role/managed/AWSManagedAccountManagementAccessRole
    - arn:aws:iam::632839731153:role/managed/AWSManagedAdvancedFeaturesActivationRole
  okta:
    # The administrator (Super Administrator).
    - will+1234@rookwright.com
    # Substrate's collector app (Read-only Administrator).
    - 0oa18e2pm9kK4q9K3698
  github:
    # Since the move to the rookwright-test organization (2026-10-26):
    # the separate admin account (organization owner, so admin on the
    # repository), used for administration only (ac-6.2); the
    # administrator's everyday account (write); and the independent
    # reviewer (write, so his approvals satisfy branch protection).
    - rookwright-admin
    - kernwill
    - elliskern
non_privileged_use:
  # ac-6.2: the administrator uses the non-privileged will+daily account
  # for everything that isn't administration (set up 2026-10-20), and
  # signs in as will+1234 only through the admin URL. From this date,
  # substrate fails ac-6.2 if any Okta admin signs in to an app not
  # listed here. GitHub isn't judged yet, so ac-6.2 stays undetermined
  # while the repository is in the boundary.
  since: 2026-10-21
  # Okta Admin Console: administration. Okta Authenticator: setting up
  # or changing one's own sign-in methods (Okta Verify), which is
  # account security.
  okta_security_apps: [Okta Admin Console, Okta Authenticator]
  # AWS: no principal with security access (access.aws above, plus root)
  # reads or writes S3 objects outside these buckets, or reads any
  # secret. The trail has recorded S3 data events since the
  # 2026-10-21 14:04 UTC apply (PR #65). Moved from 2026-10-22 to the
  # day after the trail last changed: PR #67 set its KMS key
  # (2026-10-23 20:52 UTC), and a trail change after this date stops
  # the judgment.
  aws_since: 2026-10-24
  # The audit bucket (logs: reviewing them is a security function; the
  # trail doesn't record its objects) and the Terraform state bucket
  # (the infrastructure's configuration). The application buckets are
  # nonsecurity data.
  aws_security_buckets: [substrate-self-test-audit-632839731153, substrate-self-test-tfstate-632839731153]
  # None. Reading the database master secret is using the application's
  # data (decided 2026-10-21). Reading the EventBridge connection's
  # secret (the issue-writer token) is never needed: rotation uses
  # update-connection, which writes it.
  aws_security_secrets: []
integrity:
  # The nightly check for changes made outside a reviewed pull request
  # (si-7). check runs terraform plan; report-drift runs only when the
  # live account differs from main and opens an incident issue. At most
  # 26 hours between successful checks (si-7.1). The check runs every six
  # hours, so a late GitHub schedule can't open a gap that long.
  workflow: .github/workflows/drift-check.yml
  check_job: check
  report_job: report-drift
  max_hours_between_checks: 26
  # Each detected change becomes an incident issue with this label
  # (si-7.7). Shown by a drift drill on 2026-10-09 (issue #30).
  drift_issue_label: drift
incidents:
  # A GuardDuty finding of Medium severity (4.0) or above is an incident
  # (ir-5). Its issue must be opened automatically within 15 minutes
  # (ir-4.1) and assigned to the Administrator, whom GitHub notifies
  # (si-4.5).
  min_guardduty_severity: 4
  max_minutes_to_issue: 15
  alert_recipients: [kernwill]
  # Incident events EventBridge couldn't deliver to GitHub (incidents.tf).
  # Any message here is an incident with no record (ir-5, ir-4.1).
  dead_letter_queues: [substrate-incident-issues-dlq]
incident_drills:
  # A drill at least monthly (ir-3), each acknowledged within 3 days by
  # closing its issue with a comment (continuous-monitoring.md).
  max_days_between_drills: 35
  acknowledge_within_hours: 72
  acknowledgers: [kernwill]
contingency_tests:
  # The weekly restore test of the database (cp-4, cp-9.1, cp-10;
  # contingency-plan.md): RTO 4 hours, RPO 24 hours, each test reviewed
  # within 3 days.
  restore_testing_plan: substrate_self_test_weekly
  protected_resources:
    - arn:aws:rds:us-east-2:632839731153:db:substrate-self-test
  max_days_between_tests: 8
  recovery_time_objective_hours: 4
  recovery_point_objective_hours: 24
  review_within_hours: 72
  reviewers: [kernwill]
transmission:
  # The AWS services the system uses, probed at
  # <service>.<region>.amazonaws.com in each declared Region for TLS
  # (sc-8.1, sc-23). Okta's org and GitHub come from the boundary.
  aws_services: [backup, cloudtrail, config, events, guardduty, kms, logs, rds, s3, secretsmanager, securityhub, sqs, sts]
  # How administrators reach the system remotely (ac-17.2): every
  # component's web console and its API, over the internet. Substrate
  # adds the consoles to the probes (AWS sign-in and each Region's
  # console, Okta's Admin Console, github.com) and requires modern,
  # authenticated encryption on every one.
  remote_access: [api, web_console]
# The FedRAMP authorization each component type inherits from
# (substrate docs/adr/0024). A control counts as inherited only when
# every declared component's provider provides it, so with Okta and
# GitHub undeclared (neither is on a FedRAMP-authorized offering)
# nothing is inherited yet; the report lists what AWS alone would give.
# The pin is the sha256 of AWS's "FedRAMP Customer Package" PDF from
# AWS Artifact, downloaded 2026-10-10. The file itself is AWS
# Confidential and is never committed here; substrate reads it from a
# local path.
inheritance:
  aws:
    marketplace_id: AGENCYAMAZONEW
    matrix_sha256: c168532979242286212996c101f564ac331bff9b94f9f5b4dc6897c78043936e

# Who may manage audit logging (au-9.4): change or stop CloudTrail, or
# delete, redirect or change the retention of CloudWatch Logs groups in
# AWS; configure log streaming in Okta (Super Administrator only).
# Substrate fails the control if anyone else can.
audit_management:
  aws:
    # Terraform and the administrator.
    - arn:aws:iam::632839731153:user/substrate-admin
    # Rookwright's management account's access to this account, created
    # by AWS when the account joined the organization.
    - arn:aws:iam::632839731153:role/managed/AccountFullAccessRole
  okta:
    # The administrator (Super Administrator).
    - will+1234@rookwright.com

# The monthly privilege review (ac-6.7): a workflow opens a
# privilege-review issue on the 1st; a reviewer closes it with a comment
# within a week.
privilege_reviews:
  max_days_between_reviews: 35
  review_within_hours: 168
  reviewers: [elliskern, kernwill]

# Functions, ports, protocols and services (cm-7.1): reviewed monthly
# (functions-review.yml opens the issue on the 8th; a reviewer closes it
# with a comment within a week). The inbound security group rules deemed
# necessary, in every Region, as substrate names them ("<group>
# <protocol>[:<from>-<to>] from <source>"). None: nothing in the system
# accepts inbound connections.
functions_review:
  max_days_between_reviews: 35
  review_within_hours: 168
  reviewers: [elliskern, kernwill]
  allowed_ingress: []

# Audit logging failures (au-5) alert the incident alert recipients
# through an incident issue (audit_alerts.tf): CloudTrail stopped or
# deleted, or Okta's archived System Log silent for this many hours. A
# drill exercises the alert path monthly; acknowledge it like the
# incident drill.
audit_failure_alerts:
  okta_silence_hours: 24
  max_days_between_drills: 35

# Replacing unsupported components (sa-22). RDS engines are judged
# against AWS's own support dates. HashiCorp publishes no per-version
# support status, so Terraform providers and the Terraform CLI follow
# HashiCorp's stated policy: only the newest major version is supported.
# GitHub Actions count as supported only on these runtimes (node24 is the
# current one; listing fewer can only make the check stricter).
supported_components:
  provider_support: latest_major
  action_runtimes: [node24]

# Flaw remediation (si-2) uses CR26's own times (VDR-TFR-PVR and
# VDR-TFR-KEV) for this certification class. Until a finding's Potential
# Agency Impact is rated, it is held to the strictest: N5,
# internet-reachable, likely exploitable unless Inspector says no exploit
# is known (2 days for Class C).
vulnerability_response:
  certification_class: c

# The nightly inventory (cm-8.3, pl-9): AWS resources in AWS Config's
# inventory but neither in Terraform state nor created by AWS. Finding
# one opens an incident issue. The exceptions are resources deliberately
# outside Terraform.
inventory:
  workflow: .github/workflows/drift-check.yml
  check_job: inventory
  report_job: report-inventory
  max_hours_between_checks: 26
  exceptions:
    # The bootstrap administrator: it creates everything else, so it
    # can't be created by Terraform.
    - arn:aws:iam::632839731153:user/substrate-admin
    # Created by AWS when the account joined Rookwright's organization.
    - arn:aws:iam::632839731153:role/managed/AccountFullAccessRole
    - arn:aws:iam::632839731153:role/managed/AWSManagedAccountManagementAccessRole
    - arn:aws:iam::632839731153:role/managed/AWSManagedAdvancedFeaturesActivationRole

# Disposal after retention (si-12.3): every bucket is either disposed of
# by S3 lifecycle expiration after the days given (retention.tf), or kept
# with a reason. Old object versions in versioned buckets expire within
# noncurrent_days of being replaced or deleted.
disposal:
  noncurrent_days: 30
  buckets:
    substrate-self-test-app-data-632839731153: 365
    substrate-self-test-app-logs-632839731153: 365
    substrate-self-test-audit-632839731153: 365
  keep:
    substrate-self-test-tfstate-632839731153: Terraform state, the system's own record of what it manages
