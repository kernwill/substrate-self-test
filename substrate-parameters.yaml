# Organization-defined parameter values for the substrate self-test: the
# yardsticks NIST leaves to the organization. Like the boundary file,
# this is the provider's declaration, approved through a reviewed pull
# request. It is never evidence: substrate judges collected evidence
# against it, and every report shows these values.
owner: Will Kern, CEO
declared_on: 2026-10-09
okta:
  # Every app sign-in policy in the Okta org, classified by who signs in
  # through it (ia-2.2 MFA for non-privileged accounts, ia-2.8
  # replay-resistant authentication). An unclassified policy leaves both
  # controls undetermined.
  privileged_access_policies:
    - Okta Admin Console
  non_privileged_access_policies:
    - Any two factors
    - Okta Account Management Policy
    - Okta Browser Plugin
    - Okta Dashboard
    - Okta OIN Submission Tester
    - substrate test - device required
  # The Okta profile attribute that records each user's status
  # (employee, contractor and so on), for ia-4.4.
  user_status_attribute: userType
audit:
  # Information every audit record of a client request must carry, on
  # every component that generates audit records (au-3.1). Substrate
  # checks a sample of real records from CloudTrail in each declared
  # Region and from the Okta System Log.
  additional_fields: [request_id, source_address, user_agent]
access:
  # Who is authorized to use security functions or reach
  # security-relevant information (ac-6.1). Substrate fails the control
  # if anyone else holds such access.
  #
  # AWS: an action on any of these services counts as security access.
  aws_security_services: [access-analyzer, cloudtrail, config, guardduty, iam, inspector2, kms, macie2, organizations, securityhub, sso]
  aws:
    # Terraform and the administrator.
    - arn:aws:iam::632839731153:user/substrate-admin
    # Substrate's read-only collector (reads security settings).
    - arn:aws:iam::632839731153:role/substrate-collector
    # The nightly drift check (GitHub Actions on main, by OIDC): reads
    # configuration, never data.
    - arn:aws:iam::632839731153:role/substrate-drift-check
    # Created by AWS when the account joined Rookwright's organization:
    # console access through AWS's account-access service, and two roles
    # Rookwright's management account (537695480935) uses to manage it.
    - arn:aws:iam::632839731153:role/managed/AccountFullAccessRole
    - arn:aws:iam::632839731153:role/managed/AWSManagedAccountManagementAccessRole
    - arn:aws:iam::632839731153:role/managed/AWSManagedAdvancedFeaturesActivationRole
  okta:
    # The administrator (Super Administrator).
    - will+1234@rookwright.com
    # Substrate's collector app (Read-only Administrator).
    - 0oa18e2pm9kK4q9K3698
  github:
    # The administrator (admin) and the independent reviewer (write,
    # so his approvals satisfy branch protection).
    - kernwill
    - elliskern
integrity:
  # The nightly check for changes made outside a reviewed pull request
  # (si-7). check runs terraform plan; report-drift runs only when the
  # live account differs from main and opens an incident issue. At most
  # 26 hours between successful checks: nightly, with slack (si-7.1).
  workflow: .github/workflows/drift-check.yml
  check_job: check
  report_job: report-drift
  max_hours_between_checks: 26
incidents:
  # A GuardDuty finding of Medium severity (4.0) or above is an incident
  # (ir-5). Its issue must be opened automatically within 15 minutes
  # (ir-4.1) and assigned to the Administrator, whom GitHub notifies
  # (si-4.5).
  min_guardduty_severity: 4
  max_minutes_to_issue: 15
  alert_recipients: [kernwill]
  # Incident events EventBridge couldn't deliver to GitHub (incidents.tf).
  # Any message here is an incident with no record (ir-5, ir-4.1).
  dead_letter_queues: [substrate-incident-issues-dlq]
